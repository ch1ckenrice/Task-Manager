<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager — localStorage</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app-shell">
    <header class="app-header">
        <div class="app-icon">
            <svg xmlns="http://www.w3.org/2000/svg" class="icon-lg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/>
            </svg>
        </div>
        <h1>Task Manager</h1>
        <p>Простий менеджер задач із локальним збереженням</p>
    </header>

    <section class="stats-grid" id="stats">
        <div class="stat-card">
            <div class="stat-number stat-total" id="statTotal">0</div>
            <div class="stat-label">Всього</div>
        </div>
        <div class="stat-card">
            <div class="stat-number stat-active" id="statActive">0</div>
            <div class="stat-label">Активні</div>
        </div>
        <div class="stat-card">
            <div class="stat-number stat-done" id="statDone">0</div>
            <div class="stat-label">Виконано</div>
        </div>
    </section>

    <section class="panel">
        <h2>Нова задача</h2>
        <form id="taskForm" class="task-form" novalidate>
            <div class="form-field">
                <label for="title">Назва <span class="required">*</span></label>
                <input
                    type="text"
                    id="title"
                    name="title"
                    required
                    maxlength="120"
                    placeholder="Наприклад: Купити продукти">
                <p class="hidden error-message" id="titleError">Введіть назву задачі</p>
            </div>

            <div class="form-field">
                <label for="description">Опис <span class="optional">(необов'язково)</span></label>
                <textarea
                    id="description"
                    name="description"
                    rows="2"
                    maxlength="500"
                    placeholder="Додайте деталі..."></textarea>
            </div>

            <div class="form-field">
                <label for="deadline">Дедлайн <span class="optional">(необов'язково)</span></label>
                <input type="datetime-local" id="deadline" name="deadline">
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">
                    <svg xmlns="http://www.w3.org/2000/svg" class="icon-sm" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>
                    </svg>
                    Додати задачу
                </button>
                <button type="reset" id="resetBtn" class="btn btn-secondary">Очистити форму</button>
            </div>
        </form>
    </section>

    <section class="toolbar">
        <div class="filter-tabs" role="tablist">
            <button data-filter="all" class="filter-btn active">Усі</button>
            <button data-filter="active" class="filter-btn">Активні</button>
            <button data-filter="done" class="filter-btn">Виконані</button>
        </div>
        <button id="clearAllBtn" class="clear-all-btn">
            <svg xmlns="http://www.w3.org/2000/svg" class="icon-sm" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6M1 7h22M9 7V4a1 1 0 011-1h4a1 1 0 011 1v3"/>
            </svg>
            Очистити все
        </button>
    </section>

    <section>
        <ul id="taskList" class="task-list"></ul>
        <div id="emptyState" class="hidden empty-state">
            <div class="empty-icon">
                <svg xmlns="http://www.w3.org/2000/svg" class="icon-md" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
                </svg>
            </div>
            <p class="empty-title">Задач поки немає</p>
            <p class="empty-text">Додайте першу задачу за допомогою форми вище</p>
        </div>
    </section>

    <footer class="app-footer">
        Дані зберігаються локально в браузері (localStorage)
    </footer>
</div>

<div id="editModal" class="hidden modal">
    <div class="modal-dialog" role="dialog" aria-modal="true">
        <div class="modal-header">
            <h3>Редагувати задачу</h3>
            <button id="closeModal" class="icon-button" aria-label="Закрити">
                <svg xmlns="http://www.w3.org/2000/svg" class="icon-md" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
                </svg>
            </button>
        </div>
        <form id="editForm" class="task-form">
            <input type="hidden" id="editId">
            <div class="form-field">
                <label for="editTitle">Назва</label>
                <input type="text" id="editTitle" required maxlength="120">
            </div>
            <div class="form-field">
                <label for="editDescription">Опис</label>
                <textarea id="editDescription" rows="3" maxlength="500"></textarea>
            </div>
            <div class="form-field">
                <label for="editDeadline">Дедлайн</label>
                <input type="datetime-local" id="editDeadline">
            </div>
            <div class="modal-actions">
                <button type="button" id="cancelEdit" class="btn btn-secondary">Скасувати</button>
                <button type="submit" class="btn btn-primary">Зберегти</button>
            </div>
        </form>
    </div>
</div>

<div id="toast" class="hidden toast"></div>

<script src="app.js"></script>
</body>
</html>
